<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light"><!-- 第一版不做暗色(设计文档 §8) -->
  <title>RAG 问答</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body data-page="qa">
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 7.5 12 4l8 3.5-8 3.5-8-3.5Z"/>
        <path d="M4 12.5 12 16l8-3.5"/>
        <path d="M4 17 12 20.5 20 17"/>
      </svg>
      <span>RAG 问答系统</span>
    </div>

    <nav class="nav">
      <a class="nav-item is-active" href="./" aria-current="page">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.5 12a7.5 7.5 0 0 1-7.5 7.5H8L4 22v-4.6A7.5 7.5 0 0 1 7.5 4.5H13A7.5 7.5 0 0 1 20.5 12Z"/>
        </svg>
        问答
      </a>
      <a class="nav-item" href="./data.html">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <ellipse cx="12" cy="6" rx="7.5" ry="3"/>
          <path d="M4.5 6v12c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3V6"/>
          <path d="M4.5 12c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3"/>
        </svg>
        数据
      </a>
    </nav>

    <div class="sidebar-foot">
      <span class="foot-label">当前会话</span>
      <code id="session-label" title="">—</code>
    </div>
  </aside>

  <div class="content">
    <header class="page-head">
      <div class="page-title">
        <h1>问答</h1>
        <p class="page-sub">基于已入库资料回答;资料里没有的,会直接告诉你没有相关内容。</p>
      </div>
      <div class="page-actions">
        <button id="new-chat-btn" class="btn" type="button">新对话</button>
      </div>
    </header>

    <main id="chat-area" class="chat-area"><!-- 气泡由 JS 渲染 --></main>

    <footer class="input-bar">
      <div class="composer">
        <textarea id="question-input" rows="1"
                  placeholder="输入问题,Enter 发送,Shift+Enter 换行"></textarea>
        <button id="send-btn" class="btn btn-primary" type="button">发送</button>
      </div>
    </footer>
  </div>

</div>

<div id="toast-layer" class="toast-layer" role="status" aria-live="polite"></div>

<script src="./app.js"></script>
</body>
</html>
